# Minotaur Maze log pipeline (SRS §8.1, Appendix B).
#
#   Filebeat DaemonSet --beats:5044--> Logstash --> Elasticsearch
#
# Each service writes one JSON object per line to stdout. Filebeat ships the
# raw line in [message]. This pipeline:
#   1. parses the JSON and drops anything malformed,
#   2. sets @timestamp from the event's own `ts`,
#   3. normalises `source` (human | bot) and checks `bot_style` (FR-M-17),
#   4. routes each event to minotaur-game-*, minotaur-ai-* or minotaur-pipeline-*.
#
# Appendix B common fields (ts, event, service, build, model_version, game_id,
# source, bot_style) are kept at the document root, unrenamed, so the trainer
# and Kibana see exactly the names in the SRS. Kubernetes metadata added by
# Filebeat is kept as well.

input {
  beats {
    port => 5044
  }
}

filter {
  # --- 1. Parse ------------------------------------------------------------

  if ![message] {
    drop { }
  }

  # Move the raw line aside, so [message] is set only if the event itself
  # carries one (the `error` event does, per Appendix B).
  mutate {
    rename => { "message" => "[@metadata][raw]" }
  }

  # Cheap pre-filter: Filebeat collects every container's output, including
  # plain-text startup banners. Drop anything that is not a JSON object before
  # the json filter, so those lines don't flood the Logstash log with parse errors.
  if [@metadata][raw] !~ /^\s*\{/ {
    drop { }
  }

  # No target: Appendix B fields land at the document root under their own names.
  json {
    source => "[@metadata][raw]"
  }

  if "_jsonparsefailure" in [tags] {
    drop { }
  }

  # An event without these three cannot be timed, attributed or routed.
  if ![ts] or ![event] or ![service] {
    drop { }
  }

  # --- 2. Timestamp ----------------------------------------------------------

  # `ts` is kept as sent; @timestamp is derived from it. Accepts ISO 8601 or
  # epoch seconds (int or float). On failure the event is kept with Logstash's
  # receive time and tagged, never dropped.
  date {
    match          => ["ts", "ISO8601", "UNIX"]
    target         => "@timestamp"
    tag_on_failure => ["_ts_parse_failure"]
  }

  # --- 3. Route by event type ------------------------------------------------
  #
  #   game      game_start, step, game_end              -> Gameplay dashboard, trainer
  #   ai        minotaur_decision, prediction_outcome,  -> Minotaur model dashboard
  #             fallback
  #   pipeline  model_trained, model_deployed,          -> Delivery dashboard
  #             app_deployed
  #
  # `error` events and unknown event types are routed by the emitting service,
  # so they stay next to that service's other events. Unknown types are tagged
  # so they are easy to find in Discover and never mistaken for schema events.

  if [event] in ["game_start", "step", "game_end"] {
    mutate { replace => { "[@metadata][family]" => "game" } }
  } else if [event] in ["minotaur_decision", "prediction_outcome", "fallback"] {
    mutate { replace => { "[@metadata][family]" => "ai" } }
  } else if [event] in ["model_trained", "model_deployed", "app_deployed"] {
    mutate { replace => { "[@metadata][family]" => "pipeline" } }
  } else {
    if [event] != "error" {
      mutate { add_tag => ["_unknown_event_type"] }
    }
    if [service] == "minotaur" {
      mutate { replace => { "[@metadata][family]" => "ai" } }
    } else if [service] in ["trainer", "pipeline"] {
      mutate { replace => { "[@metadata][family]" => "pipeline" } }
    } else {
      mutate { replace => { "[@metadata][family]" => "game" } }
    }
  }

  # --- 4. source / bot_style (FR-M-17, §8.1) ---------------------------------
  #
  # Game and Minotaur events belong to a game played by a human or a bot.
  # The trainer selects on these fields, so anything that is not clearly
  # human or bot becomes `unknown` and is excluded from training by default.

  if [@metadata][family] in ["game", "ai"] {
    if [source] {
      mutate { lowercase => ["source"] }
    } else if [bot_style] {
      mutate { replace => { "source" => "bot" } }
    }

    if [source] not in ["human", "bot"] {
      mutate {
        replace => { "source" => "unknown" }
        add_tag => ["_invalid_source"]
      }
    }

    if [source] == "bot" and ![bot_style] {
      mutate { add_tag => ["_missing_bot_style"] }
    }
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    user     => "logstash_internal"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"

    # Daily indices per event family. Index templates and the 30-day lifecycle
    # policy (SRS §8.1 step 4) are added later by the `elk` Ansible role, so
    # Logstash neither installs templates nor manages ILM itself.
    index           => "minotaur-%{[@metadata][family]}-%{+YYYY.MM.dd}"
    data_stream     => false
    ilm_enabled     => false
    manage_template => false
  }
}
