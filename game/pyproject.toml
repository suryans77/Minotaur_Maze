[project]
name = "minotaur-game"
version = "0.1.0"
description = "Minotaur Maze game server: authoritative rules and WebSocket endpoint"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "pyyaml>=6.0",  # config/game.yaml
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",  # required by starlette.testclient (plain httpx is deprecated there)
    "pytest>=8.3",
    "ruff>=0.8",
    "websockets>=13",  # real-server WebSocket test client (also pulled in by uvicorn[standard])
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
